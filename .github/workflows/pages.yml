name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Publishing happens by pushing the built site to the gh-pages branch,
# which is what this repo's Pages source is set to ("Deploy from a
# branch"). If you ever switch Settings -> Pages -> Source to "GitHub
# Actions", replace the deploy step with actions/deploy-pages.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # The demo is only worth publishing if the port still passes
      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build web
        working-directory: app
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/"
          touch build/web/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd app/build/web
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
